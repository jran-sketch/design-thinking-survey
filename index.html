<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TF팀 합류 지원서</title>
  <style>
    body{font-family:Arial,sans-serif;background:#f7f8fc;margin:0;padding:40px 20px;color:#111827}
    .wrap{max-width:800px;margin:auto;background:white;border-radius:20px;padding:40px;box-shadow:0 12px 30px rgba(0,0,0,.06)}
    h1{margin-top:0}
    .group{margin-bottom:28px}
    label{display:block;font-weight:700;margin-bottom:8px}
    input,select,textarea{width:100%;padding:14px;border:1px solid #d9deea;border-radius:10px;box-sizing:border-box;font-size:15px}
    .row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    .radio{display:block;border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin:8px 0;font-weight:400}
    button{width:100%;padding:16px;border:0;border-radius:12px;background:#4f46e5;color:white;font-weight:700;font-size:16px}
    @media(max-width:640px){.row{grid-template-columns:1fr}.wrap{padding:24px}}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>TF팀 합류 지원서</h1>
    <p>한 학기 동안 함께 서비스를 혁신할 최적의 실무 TF팀 구성을 위한 기초 설문입니다.</p>

    <form id="surveyForm">
      <div class="group">
        <label>1. 기본 정보</label>
        <div class="row">
          <input name="name" placeholder="이름" required>
          <input name="studentId" placeholder="학번" required>
          <input name="major" placeholder="전공" required>
        </div>
        <div style="margin-top:12px">
          <select name="classGroup" required>
            <option value="" disabled selected>분반 선택</option>
            <option value="월요일 9시">월요일 9시</option>
            <option value="월요일 13시">월요일 13시</option>
            <option value="금요일 9시">금요일 9시</option>
            <option value="금요일 11시">금요일 11시</option>
            <option value="금요일 13시">금요일 13시</option>
            <option value="금요일 15시">금요일 15시</option>
          </select>
        </div>
      </div>

      <div class="group">
        <label>2. 내가 가장 혁신해보고 싶은 타겟 산업군은?</label>
        <div class="row" style="grid-template-columns:1fr 1fr">
          <select name="industry1" required>
            <option value="" disabled selected>1지망 선택</option>
            <option value="핀테크 / 금융">핀테크 / 금융</option>
            <option value="유통 / 커머스">유통 / 커머스</option>
            <option value="푸드테크 / F&B">푸드테크 / F&B</option>
            <option value="콘텐츠 / 엔터테인먼트">콘텐츠 / 엔터테인먼트</option>
            <option value="모빌리티 / 트래블">모빌리티 / 트래블</option>
            <option value="라이프스타일 / 에듀테크">라이프스타일 / 에듀테크</option>
          </select>
          <select name="industry2" required>
            <option value="" disabled selected>2지망 선택</option>
            <option value="핀테크 / 금융">핀테크 / 금융</option>
            <option value="유통 / 커머스">유통 / 커머스</option>
            <option value="푸드테크 / F&B">푸드테크 / F&B</option>
            <option value="콘텐츠 / 엔터테인먼트">콘텐츠 / 엔터테인먼트</option>
            <option value="모빌리티 / 트래블">모빌리티 / 트래블</option>
            <option value="라이프스타일 / 에듀테크">라이프스타일 / 에듀테크</option>
          </select>
        </div>
      </div>

      <div class="group">
        <label>3. 이번 프로젝트에서 훈련하고 싶은 역할은?</label>
        <label class="radio"><input type="radio" name="role" value="PM (기획자)" required> PM (기획자)</label>
        <label class="radio"><input type="radio" name="role" value="UX/UI 디자이너"> UX/UI 디자이너</label>
        <label class="radio"><input type="radio" name="role" value="마케터 / 전략가"> 마케터 / 전략가</label>
        <label class="radio"><input type="radio" name="role" value="데이터 / 엔지니어"> 데이터 / 엔지니어</label>
      </div>

      <div class="group">
        <label>4. 팀 프로젝트에서 나의 작업 스타일은?</label>
        <label class="radio"><input type="radio" name="workStyle" value="파워 계획형" required> 파워 계획형</label>
        <label class="radio"><input type="radio" name="workStyle" value="벼락치기형"> 벼락치기형</label>
        <label class="radio"><input type="radio" name="workStyle" value="아이디어 뱅크형"> 아이디어 뱅크형</label>
        <label class="radio"><input type="radio" name="workStyle" value="장인형"> 장인형</label>
      </div>

      <div class="group">
        <label>5. 최근 이용하면서 불편했던 서비스나 앱이 있다면 자유롭게 적어주세요.</label>
        <textarea name="painPoint" rows="5" required></textarea>
      </div>

      <button type="submit">지원서 제출하기</button>
    </form>
  </div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwk8sRY1DzmNys1jdj88xkJG5MRlVJdhlg8Zuppk4spBZ5dNj5oR5ZNy9lDsAHOzbhm/exec';
document.getElementById('surveyForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target).entries());
  if (data.industry1 === data.industry2) {
    alert('1지망과 2지망은 다르게 선택해주세요.');
    return;
  }
  await fetch(SCRIPT_URL, {
    method:'POST',
    mode:'no-cors',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(data)
  });
  alert('제출되었습니다.');
  e.target.reset();
});
</script>
</body>
</html>
